name: CI
on:
  pull_request:
  push:
jobs:
  python:
    name: CI Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pytest -q
  nessie-image:
    name: CI Nessie Image (ghcr.io/projectnessie/nessie:0.63.0)
    runs-on: ubuntu-latest
    steps:
      - run: docker build .
