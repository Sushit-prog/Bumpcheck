name: BumpCheck

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bumpcheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out action source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false

      - name: Check dependency bumps
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lockfile: uv.lock
          lock-kind: uv.lock
          fail-on: REVIEW
          comment: "true"
          artifact-name: bumpcheck-report-${{ github.event.number }}
