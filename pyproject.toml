[project]
name = "bumpcheck"
version = "0.1.0"
description = "Analyze whether a dependency bump will break your code."
readme = "README.md"
authors = [
    { name = "Sushit-prog", email = "pakrashys@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "griffe>=2.4.1",
    "packaging",
    "pydantic>=2",
    "pyyaml>=6",
    "typer",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
bumpcheck = "bumpcheck.cli:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [
    "tests/fixtures/usage_repo",
    "bench/v0-candidates",
    "bench/v0-failures",
    "bench/**/snapshots",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
